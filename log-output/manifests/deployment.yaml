apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-volume
          emptyDir: {}
      containers:
        - name: log-output-writer
          image: bvadocker/log-output-writer:1.10
          volumeMounts:
            - name: shared-volume
              mountPath: /shared
        - name: log-output-reader
          image: bvadocker/log-output-reader:1.10
          volumeMounts:
            - name: shared-volume
              mountPath: /shared