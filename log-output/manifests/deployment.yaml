apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 2000
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: log-output-pvc
        - name: config-volume
          configMap:
            name: log-output-cm
      containers:
        - name: log-output-writer
          image: bvadocker/log-output-writer:2.1
          imagePullPolicy: Always
          volumeMounts:
            - name: shared-volume
              mountPath: /shared
        - name: log-output-reader
          image: bvadocker/log-output-reader:2.5
          imagePullPolicy: Always
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-cm
                  key: MESSAGE
          volumeMounts:
            - name: shared-volume
              mountPath: /shared
            - name: config-volume
              mountPath: /config
