apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-output-pvc # name of the volume claim, this will be used in the deployment
spec:
  storageClassName: log-output-pv # this is the name of the persistent volume we are claiming
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi