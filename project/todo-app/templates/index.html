<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 20px;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        h1 {
            margin-bottom: 20px;
        }

        img {
            max-width: 400px;
            width: 100%;
            height: auto;
            display: block;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
            width: 60%;
            min-width: 280px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .send-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 0 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #218838;
        }

        .send-btn:active {
            background-color: #1e7e34;
            transform: translateY(1px);
        }

        h2 {
            width: 100%;
            margin: 20px 0;
            text-align: center;
        }

        .todo-list {
            width: 100%;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .todo-item {
            background-color: #f0f0f0;
            border-left: 6px solid #28a745;
            padding: 15px 20px;
            margin-bottom: 2px;
            font-weight: bold;
            width: 100%;
            text-align: left;
        }

        .caption {
            margin-top: auto; 
            margin-bottom: 15px;
            font-size: 0.85rem;
            font-style: italic;
            width: 100%;
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Todo App</h1>
    <img src="{{ image_url }}" alt="Random Image">
    
    <!-- Input field -->
    <div class="input-container">
        <input type="text" maxlength="140" placeholder="Enter a new todo (max 140 characters)">
        <button class="send-btn">Send</button>
    </div>

    <!-- Todos list -->
    <h2>Todos</h2>
    <ul class="todo-list">
        <li class="todo-item">Learn Kubernetes basics</li>
        <li class="todo-item">Deploy application to cluster</li>
        <li class="todo-item">Configure persistent volumes</li>
    </ul>

    <!-- Footer -->
    <div class="caption">DevOps with Kubernetes 2026</div>
</body>
</html>
