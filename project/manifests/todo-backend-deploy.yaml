apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: docker.io/bvadocker/todo-backend:2.6
          imagePullPolicy: Always
          env:
          - name: BACKEND_PORT
            valueFrom:
              configMapKeyRef:
                name: project-cm
                key: BACKEND_PORT
          - name: BACKEND_SUFFIX
            valueFrom:
              configMapKeyRef:
                name: project-cm
                key: BACKEND_SUFFIX
