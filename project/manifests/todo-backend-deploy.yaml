apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      initContainers:
        - name: pg-check
          image: postgres:alpine
          command: ['sh', '-c', 'until pg_isready -h $DB_HOST -p $DB_PORT; do echo Waiting for DB...; sleep 2; done']
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: todo-cm
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: todo-cm
                  key: DB_PORT
      containers:
        - name: todo-backend
          image: docker.io/bvadocker/todo-backend:2.8
          imagePullPolicy: Always
          env:
          - name: BACKEND_PORT
            valueFrom:
              configMapKeyRef:
                name: todo-cm
                key: BACKEND_PORT
          - name: BACKEND_SUFFIX
            valueFrom:
              configMapKeyRef:
                name: todo-cm
                key: BACKEND_SUFFIX
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: todo-cm
                key: DB_HOST
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: todo-cm
                key: DB_NAME
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: todo-cm
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: todo-secret
                key: DB_PASSWORD
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: todo-cm
                key: DB_PORT