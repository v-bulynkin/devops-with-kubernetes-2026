apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: todo-app-pvc
      containers:
        - name: todo-app
          image: docker.io/bvadocker/todo-app:2.2
          imagePullPolicy: Always
          volumeMounts:
            - name: cache-volume
              mountPath: /data
          env:
          # BACKEND_BASE_URL (backend external address like http://k1:8081)
          - name: BACKEND_BASE_URL
            value: "http://k1:8081"
