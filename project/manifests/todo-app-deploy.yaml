apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: todo-app-pvc
      containers:
        - name: todo-app
          image: docker.io/bvadocker/todo-app:2.6
          imagePullPolicy: Always
          volumeMounts:
            - name: cache-volume
              mountPath: /data
          env:
          - name: BACKEND_BASE_URL
            valueFrom:
              configMapKeyRef:
                name: project-cm
                key: BACKEND_BASE_URL
          - name: APP_PORT
            valueFrom:
              configMapKeyRef:
                name: project-cm
                key: APP_PORT
          - name: CACHE_DIR
            valueFrom:
              configMapKeyRef:
                name: project-cm
                key: CACHE_DIR
          - name: CACHE_FILE
            valueFrom:
              configMapKeyRef:
                name: project-cm
                key: CACHE_FILE
          - name: META_FILE
            valueFrom:
              configMapKeyRef:
                name: project-cm
                key: META_FILE
          - name: CACHE_DURATION
            valueFrom:
              configMapKeyRef:
                name: project-cm
                key: CACHE_DURATION
          - name: IMAGES_BASEURL
            valueFrom:
              configMapKeyRef:
                name: project-cm
                key: IMAGES_BASEURL
          - name: IMAGES_EXTENSION
            valueFrom:
              configMapKeyRef:
                name: project-cm
                key: IMAGES_EXTENSION
          - name: TEMPLATE_IMAGE_URL
            valueFrom:
              configMapKeyRef:
                name: project-cm
                key: TEMPLATE_IMAGE_URL

