apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: ping-pong
          image: bvadocker/ping-pong:2.1
          imagePullPolicy: Always
          volumeMounts:
            - name: shared-volume
              mountPath: /shared
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: log-output-pvc