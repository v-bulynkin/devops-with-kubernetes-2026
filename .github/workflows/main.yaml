---
#build the image
#publish the image to a artifact registry
#deploy the new image to our cluster

name: Release application
on: [push]

defaults:
  run:
    working-directory: ./project

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push todo-app
        uses: docker/build-push-action@v7
        with:
          context: project/todo-app/.
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:${{ vars.IMAGE_TAG }}

      - name: Build and push todo-backend
        uses: docker/build-push-action@v7
        with:
          context: project/todo-backend/.
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ vars.IMAGE_TAG }}
      
      - name: Install kustomize and kubectl
        uses: alexellis/arkade-get@master
        with:
          kubectl: latest
          kustomize: latest
      
      - name: Set up Kubeconfig
        run: |
          mkdir $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: Select namespace, edit kustomization.yaml
        run: |
          if [[ "$GITHUB_REF_NAME" != main ]]; then
            kustomize edit set namespace $GITHUB_REF_NAME
            kubectl create namespace $GITHUB_REF_NAME || true
            kubectl config set-context --current --namespace=$GITHUB_REF_NAME
          fi
          kustomize edit set image IMG_APP=${{ secrets.DOCKERHUB_USERNAME }}/todo-app:${{ vars.IMAGE_TAG }}
          kustomize edit set image IMG_BACKEND=${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ vars.IMAGE_TAG }}
          git config user.email "bot@actions.git"
          git config user.name "Github actions bot"
          git commit -a -m "Set images tag to ${{ vars.IMAGE_TAG }}"

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k .
