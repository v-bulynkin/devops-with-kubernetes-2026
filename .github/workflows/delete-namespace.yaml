---
# Delete the environment if the branch has been deleted
# Main branch is excluded
name: Delete namespace after branch # Static name
run-name: Delete namespace after branch ${{ github.event.ref }} # Dynamic name

on:
  delete:

jobs:
  delete-namespace:
    if: github.event.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Install kubectl
        uses: alexellis/arkade-get@master
        with:
          kubectl: latest
      
      - name: Set up Kubeconfig
        run: |
          mkdir $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: Delete namespace
        run: |
            DELETING_BRANCH="${{ github.event.ref }}"
            # SAFE_NAME - lowercase letters, digits and hyphens only
            SAFE_NAME=$(echo "${DELETING_BRANCH#refs/heads/}" |tr '[:upper:]' '[:lower:]' |sed -E 's/[^a-z0-9-]/-/g; s/-{2,}/-/g; s/^-|-$//g')
            echo "Deleting namespace $SAFE_NAME after branch ${DELETING_BRANCH}..."
            kubectl delete namespace $SAFE_NAME || true
